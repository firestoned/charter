# Build the documentation site on every PR that touches it, and publish it to
# GitHub Pages from main. Actions are pinned by commit SHA.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'deploy/**'
      - 'src/crd.rs'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - 'deploy/**'
      - 'src/crd.rs'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history for git-revision-date-localized

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Poetry (hash-locked)
        # Regenerate .github/requirements/poetry.txt after bumping poetry.in:
        #   uv pip compile --python-version 3.11 --python-platform linux --generate-hashes \
        #     --output-file=.github/requirements/poetry.txt .github/requirements/poetry.in
        run: |
          python3 -m pip install --user --require-hashes -r .github/requirements/poetry.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build (strict)
        run: make docs

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
