# Build evidence for every change: tests, lint, dependency and licence checks,
# SBOM, a signed image and SLSA build provenance. Pin actions by commit SHA
# before production use (left as tags here for readability).
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: CRD in sync with code
        run: cargo run --locked -- crd | diff - deploy/crd.yaml

  release:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign signing and provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: CycloneDX SBOM of Rust dependencies
        run: cargo install cargo-cyclonedx --locked && cargo cyclonedx --format json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: "*.cdx.json" }
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, Fulcio + Rekor transparency log)
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
