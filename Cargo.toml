[package]
name = "entra-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = { version = "5.0.0", default-features = false, features = ["runtime", "derive", "client", "rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
