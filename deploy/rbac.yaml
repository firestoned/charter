apiVersion: v1
kind: ServiceAccount
metadata:
  name: charter-iam
  namespace: charter-system
  annotations:
    # Azure Workload Identity: the Entra app (or user-assigned managed identity)
    # this controller runs as. It needs Graph Application.ReadWrite.OwnedBy only.
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: charter-iam
rules:
  - apiGroups: ["iam.rbc.example"]
    resources: ["iamclients"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["iam.rbc.example"]
    resources: ["iamclients/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Optional OpenBao delivery (spec.pushSecret). Harmless if ESO is not installed.
  - apiGroups: ["external-secrets.io"]
    resources: ["pushsecrets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: charter-iam
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: charter-iam
subjects:
  - kind: ServiceAccount
    name: charter-iam
    namespace: charter-system
