apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: iamclients.iam.rbc.example
spec:
  group: iam.rbc.example
  names:
    kind: IAMClient
    plural: iamclients
    shortNames:
    - iamc
    singular: iamclient
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.appId
      name: AppID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.secretExpiresAt
      name: SecretExpires
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for IAMClientSpec via `CustomResource`
        properties:
          spec:
            description: A team's request for an Entra app registration, plus the OIDC wiring around it.
            properties:
              deletionPolicy:
                default: Retain
                description: |-
                  What happens in Entra when this IAMClient is deleted. `Retain` (default)
                  revokes the client secrets but keeps the registration for audit and
                  recovery; `Delete` removes it (Entra soft-deletes for 30 days).
                enum:
                - Retain
                - Delete
                type: string
              dex:
                description: Optional Dex front door for this client.
                nullable: true
                properties:
                  issuerURL:
                    description: |-
                      Issuer URL of the team's Dex, e.g. `https://dex.team-payments.apps.example.com`.
                      Entra gets `<issuerURL>/callback` as its only redirect URI.
                    type: string
                required:
                - issuerURL
                type: object
              displayName:
                description: Human-readable name. Admin-only. The controller prefixes it with the platform naming prefix.
                type: string
              groups:
                default: []
                description: |-
                  Entra groups the app cares about. Emitted as the Dex connector `groups` filter,
                  and switches Entra group claims to `ApplicationGroup`.
                items:
                  type: string
                type: array
              owners:
                default: []
                description: Entra object IDs of human owners to add to the registration.
                items:
                  type: string
                type: array
              pushSecret:
                description: |-
                  Optional: also push the delivered Secret to OpenBao through an External
                  Secrets Operator `PushSecret`. Admin-only. The Kubernetes Secret is always
                  written; the PushSecret reads from it. The OpenBao path is fixed by the
                  controller (`<prefix><namespace>/<name>`), not by the team.
                nullable: true
                properties:
                  clusterSecretStore:
                    description: |-
                      `ClusterSecretStore` to push to. Must be on the controller's allow-list;
                      omitted means the controller's default store. Namespaced `SecretStore`s
                      are not accepted: the team could repoint one.
                    nullable: true
                    type: string
                type: object
              redirectURIs:
                default: []
                description: |-
                  Redirect URIs of the team's application. Owner-editable.
                  With `dex` set, these become Dex static-client redirect URIs and Entra only
                  ever sees Dex's own callback. Without `dex`, they go straight onto the Entra app.
                items:
                  type: string
                type: array
              secretRotation:
                default: 90d
                description: |-
                  How long each client secret lives, e.g. `90d` or `720h`. Rotation starts
                  when a third of the lifetime remains.
                type: string
            required:
            - displayName
            type: object
          status:
            nullable: true
            properties:
              appId:
                description: Application (client) ID of the Entra app registration.
                nullable: true
                type: string
              appliedAdminHash:
                description: Hash of the admin-only fields last applied; a mismatch needs a new approval.
                nullable: true
                type: string
              appliedSpecHash:
                description: Evidence of the approval the last applied spec was reconciled under.
                nullable: true
                type: string
              approvedBy:
                description: Approver recorded when the current admin-only state was applied.
                nullable: true
                type: string
              changeRef:
                description: Change reference the current admin-only state was applied under.
                nullable: true
                type: string
              conditions:
                default: []
                description: '`Ready`, plus `SecretPushed` when `spec.pushSecret` is set.'
                items:
                  description: Same shape as metav1.Condition, kept local so the schema derives cleanly.
                  properties:
                    lastTransitionTime:
                      description: RFC 3339 time the condition last changed status.
                      type: string
                    message:
                      description: Human-readable detail, truncated to 1000 characters.
                      type: string
                    observedGeneration:
                      description: '`metadata.generation` the condition was computed from.'
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: Machine-readable reason, e.g. `Reconciled`, `PendingApproval`, `PolicyViolation`.
                      type: string
                    status:
                      description: '`True` or `False`.'
                      type: string
                    type:
                      description: '`Ready` or `SecretPushed`.'
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              objectId:
                description: Directory object ID of the app registration.
                nullable: true
                type: string
              observedGeneration:
                description: '`metadata.generation` this status was computed from.'
                format: int64
                nullable: true
                type: integer
              pushSecretName:
                description: '`PushSecret` that copies `secretName` to OpenBao, when `spec.pushSecret` is set.'
                nullable: true
                type: string
              pushedTo:
                description: '`<clusterSecretStore>:<remoteKey>` the credentials are pushed to.'
                nullable: true
                type: string
              secretExpiresAt:
                description: RFC 3339 expiry of the current client secret.
                nullable: true
                type: string
              secretKeyId:
                description: keyId of the client secret currently delivered.
                nullable: true
                type: string
              secretName:
                description: Kubernetes Secret holding the credentials and Dex config.
                nullable: true
                type: string
              servicePrincipalId:
                description: Object ID of the service principal in the tenant.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: IAMClient
        type: object
    served: true
    storage: true
    subresources:
      status: {}
