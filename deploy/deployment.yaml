apiVersion: apps/v1
kind: Deployment
metadata:
  name: charter-iam
  namespace: charter-system
spec:
  replicas: 1   # single writer; leader election is required before scaling out
  selector:
    matchLabels: { app: charter-iam }
  template:
    metadata:
      labels:
        app: charter-iam
        azure.workload.identity/use: "true"   # webhook injects AZURE_* env and the token file
    spec:
      serviceAccountName: charter-iam
      automountServiceAccountToken: true
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: controller
          # Pin by digest; admission (e.g. Kyverno/Connaisseur) should verify the cosign signature.
          image: ghcr.io/example/charter-iam@sha256:REPLACE_WITH_SIGNED_DIGEST
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: NAME_PREFIX, value: "charter-" }
            - { name: ALLOWED_REDIRECT_DOMAINS, value: ".apps.example.rbc.com" }
            - { name: MAX_SECRET_LIFETIME_DAYS, value: "180" }
            - { name: ROTATION_GRACE_HOURS, value: "24" }
            - { name: REQUIRE_APPROVAL, value: "true" }
            - { name: RUST_LOG, value: "info,audit=info" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
