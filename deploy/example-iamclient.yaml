# What Flux renders from the ResourceSet (see flux/resourceset.yaml), after
# the owning team has added redirect URIs with `kubectl edit`.
apiVersion: iam.rbc.example/v1alpha1
kind: IAMClient
metadata:
  name: payments-portal
  namespace: team-payments
  annotations:
    iam.rbc.example/requested-by: "alice@example.com"   # admin-only
    iam.rbc.example/approved-by: "bob@example.com"      # admin-only
    iam.rbc.example/change-ref: "CHG0012345"            # admin-only
    # iam.rbc.example/last-modified-by is stamped by admission, never set by hand
spec:
  displayName: Payments Portal                          # admin-only
  redirectURIs:                                         # owner-editable
    - https://payments.apps.example.rbc.com/callback
  groups: ["APP-Payments-Users", "APP-Payments-Admins"] # admin-only
  secretRotation: 90d                                   # admin-only
  owners:                                               # admin-only
    - 11111111-1111-1111-1111-111111111111
  deletionPolicy: Retain                                # admin-only
  dex:                                                  # admin-only
    issuerURL: https://dex.team-payments.apps.example.rbc.com
  pushSecret:                                           # admin-only, optional
    clusterSecretStore: openbao                         # -> OpenBao charter/team-payments/payments-portal
